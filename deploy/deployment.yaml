apiVersion: apps/v1
kind: Deployment
metadata:
  name: patientmatch
  namespace: patientmatch
spec:
  replicas: 2
  selector:
    matchLabels:
      app: patientmatch
  template:
    metadata:
      labels:
        app: patientmatch
    spec:
      containers:
        - name: patientmatch
          image: easzlab.io.local:5000/patientmatch:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
